<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect x="0" y="0" width="1440" height="900" rx="3" fill="#0b1725" stroke="none"/>
<text x="56" y="43" fill="#e3bd78" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">STAR TOURNAMENT</text>
<text x="1384" y="43" fill="#9aaebe" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end">МАКЕТ · НЕ UNITY</text>
<path d="M56 61 L1384 61" stroke="#304453"/>
<rect x="56" y="92" width="134" height="48" rx="3" fill="#142638" stroke="#385062"/>
<text x="123.0" y="123.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">‹ НАЗАД</text>
<text x="226" y="126" fill="#e3bd78" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">СБРОС ВСЕХ НАСТРОЕК</text>
<text x="226" y="165" fill="#9aaebe" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Единственное действие сброса · перед изменением режима экрана действует отдельное безопасное подтверждение</text>
<rect x="210" y="220" width="1020" height="542" rx="3" fill="#142638" stroke="#536478"/>
<text x="254" y="280" fill="#e3bd78" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Сбросить все пользовательские настройки?</text>
<text x="254" y="350" fill="#eef2f5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Будут восстановлены настройки экрана, графики, звука,</text>
<text x="254" y="404" fill="#eef2f5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">управления и интерфейса, включая личные предпочтения.</text>
<text x="254" y="458" fill="#eef2f5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Профили, рекорды, история матчей и лаборатория сохранятся.</text>
<text x="254" y="512" fill="#eef2f5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Согласие на отправку статистики не изменится.</text>
<rect x="254" y="646" width="446" height="56" rx="3" fill="#142638" stroke="#e3bd78"/>
<text x="477.0" y="681.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Отмена</text>
<rect x="720" y="646" width="466" height="56" rx="3" fill="#142638" stroke="#385062"/>
<text x="953.0" y="681.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Сбросить все настройки</text>
<path d="M56 824 L1384 824" stroke="#304453"/>
<text x="56" y="862" fill="#9aaebe" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Shortcut верхней кнопки pad действует только в настройках, без активного текстового ввода, списка или другого диалога.</text>
