<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect x="0" y="0" width="1440" height="900" rx="3" fill="#0b1725" stroke="none"/>
<text x="56" y="43" fill="#e3bd78" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">STAR TOURNAMENT</text>
<text x="1384" y="43" fill="#9aaebe" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end">МАКЕТ · НЕ UNITY</text>
<path d="M56 61 L1384 61" stroke="#304453"/>
<rect x="56" y="92" width="134" height="48" rx="3" fill="#142638" stroke="#385062"/>
<text x="123.0" y="123.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">‹ НАЗАД</text>
<text x="226" y="126" fill="#e3bd78" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">ЛАБОРАТОРИЯ · НЕСОХРАНЁННЫЙ ЧЕРНОВИК</text>
<text x="226" y="165" fill="#9aaebe" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Один и тот же диалог перед уходом, сменой профиля или сбросом</text>
<rect x="182" y="220" width="1076" height="552" rx="3" fill="#142638" stroke="#536478"/>
<text x="224" y="274" fill="#e3bd78" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start">Отбросить изменения и вернуться в меню?</text>
<text x="224" y="321" fill="#eef2f5" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Сохранённая версия 3 и история профиля останутся без изменений.</text>
<rect x="222" y="349" width="996" height="61" rx="3" fill="#102131" stroke="none"/>
<text x="240" y="387" fill="#eef2f5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Винтовка · Урон</text>
<text x="1184" y="387" fill="#e3bd78" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="end">18 → 20</text>
<rect x="222" y="422" width="996" height="61" rx="3" fill="#102131" stroke="none"/>
<text x="240" y="460" fill="#eef2f5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Винтовка · Скорость снаряда</text>
<text x="1184" y="460" fill="#e3bd78" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="end">75 м/с → 80 м/с</text>
<rect x="222" y="495" width="996" height="61" rx="3" fill="#102131" stroke="none"/>
<text x="240" y="533" fill="#eef2f5" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">AI · Время реакции</text>
<text x="1184" y="533" fill="#e3bd78" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="end">0,4 с → 0,5 с</text>
<text x="224" y="645" fill="#9aaebe" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Несохранённые изменения будут потеряны.</text>
<rect x="224" y="681" width="510" height="52" rx="3" fill="#142638" stroke="#e3bd78"/>
<text x="479.0" y="714.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Продолжить редактирование</text>
<rect x="754" y="681" width="464" height="52" rx="3" fill="#142638" stroke="#385062"/>
<text x="986.0" y="714.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Отбросить и выйти</text>
<path d="M56 824 L1384 824" stroke="#304453"/>
<text x="56" y="862" fill="#9aaebe" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Первый фокус — безопасное продолжение. Длинный diff прокручивается внутри диалога; действия остаются доступны.</text>
</svg>