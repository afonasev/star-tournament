<text x="56" y="862" fill="#9aaebe" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Нужные права и занятые файлы проверяются до замены. Этот мастер не появляется при штатном обновлении из игры.</text>
