<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect x="0" y="0" width="1440" height="900" rx="3" fill="#0b1725" stroke="none"/>
<text x="56" y="43" fill="#e3bd78" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">STAR TOURNAMENT</text>
<text x="1384" y="43" fill="#9aaebe" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end">МАКЕТ · НЕ UNITY</text>
<path d="M56 61 L1384 61" stroke="#304453"/>
<rect x="56" y="92" width="134" height="48" rx="3" fill="#142638" stroke="#385062"/>
<text x="123.0" y="123.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">‹ НАЗАД</text>
<text x="226" y="126" fill="#e3bd78" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">ОБНОВЛЕНИЕ ИГРЫ</text>
<text x="226" y="165" fill="#9aaebe" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Состояния компактного блока главного меню · демонстрационные версии</text>
<rect x="56" y="204" width="1328" height="142" rx="3" fill="#102131" stroke="none"/>
<text x="86" y="242" fill="#e3bd78" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Доступна версия 0.1.5</text>
<text x="86" y="282" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Можно продолжить играть на установленной версии.</text>
<rect x="1090" y="238" width="264" height="48" rx="3" fill="#142638" stroke="#385062"/>
<text x="1222.0" y="269.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Обновить</text>
<rect x="86" y="302" width="220" height="32" rx="3" fill="#142638" stroke="#385062"/>
<text x="196.0" y="325.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Что нового</text>
<rect x="56" y="368" width="1328" height="142" rx="3" fill="#102131" stroke="none"/>
<text x="86" y="406" fill="#e3bd78" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Загрузка · 42 %</text>
<text x="86" y="446" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">При начале матча загрузка приостановится и продолжится в меню.</text>
<rect x="1090" y="402" width="264" height="48" rx="3" fill="#142638" stroke="#385062"/>
<text x="1222.0" y="433.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Отменить</text>
<rect x="86" y="476" width="1030" height="5" rx="3" fill="#344a5b" stroke="none"/>
<rect x="86" y="476" width="433" height="5" rx="3" fill="#e3bd78" stroke="none"/>
<rect x="56" y="532" width="1328" height="142" rx="3" fill="#102131" stroke="none"/>
<text x="86" y="570" fill="#e3bd78" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start">Версия 0.1.5 готова</text>
<text x="86" y="610" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Установится после выхода из игры. Можно продолжить играть.</text>
<rect x="1090" y="566" width="264" height="48" rx="3" fill="#142638" stroke="#385062"/>
<text x="1222.0" y="597.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Перезапустить</text>
<rect x="56" y="696" width="1328" height="96" rx="3" fill="#102131" stroke="none"/>
<text x="86" y="734" fill="#e3bd78" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Не удалось проверить обновления</text>
<text x="86" y="767" fill="#9aaebe" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Игра доступна. Следующая проверка — при следующем запуске.</text>
<path d="M56 824 L1384 824" stroke="#304453"/>
<text x="56" y="862" fill="#9aaebe" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">В обычном меню виден один актуальный блок. При текущей версии остаются номер установленной игры и «Что нового».</text>
</svg>