<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect x="0" y="0" width="1440" height="900" rx="3" fill="#0b1725" stroke="none"/>
<text x="56" y="43" fill="#e3bd78" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">STAR TOURNAMENT</text>
<text x="1384" y="43" fill="#9aaebe" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="end">МАКЕТ · НЕ UNITY</text>
<path d="M56 61 L1384 61" stroke="#304453"/>
<text x="56" y="126" fill="#e3bd78" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">НОВЫЙ ПРОФИЛЬ</text>
<text x="56" y="165" fill="#9aaebe" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Предложение · короткий заголовок, источник копии указан рядом</text>
<rect x="180" y="220" width="1080" height="532" rx="3" fill="#102131" stroke="none"/>
<text x="222" y="274" fill="#e3bd78" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Копия сохранённой версии</text>
<text x="222" y="316" fill="#eef2f5" font-family="Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start">Мой эксперимент · версия 3</text>
<text x="222" y="360" fill="#9aaebe" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Несохранённые правки не копируются.</text>
<text x="222" y="419" fill="#eef2f5" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Имя профиля</text>
<rect x="222" y="444" width="996" height="62" rx="3" fill="#142638" stroke="#e3bd78"/>
<text x="244" y="485" fill="#eef2f5" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start">Новый профиль│</text>
<text x="222" y="554" fill="#9aaebe" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Если есть правки, перед созданием появится подтверждение.</text>
<text x="222" y="590" fill="#9aaebe" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">У копии будет своя история. Релизная отметка не переносится.</text>
<rect x="222" y="649" width="340" height="54" rx="3" fill="#142638" stroke="#385062"/>
<text x="392.0" y="683.0" fill="#eef2f5" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Отмена</text>
<rect x="878" y="649" width="340" height="54" rx="3" fill="#e3bd78" stroke="#385062"/>
<text x="1048.0" y="683.0" fill="#0b1725" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">Создать</text>
<path d="M56 824 L1384 824" stroke="#304453"/>
<text x="56" y="862" fill="#9aaebe" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Поле имени поддерживает клавиатуру и экранный ввод с геймпада. Исходная сохранённая версия остаётся прежней.</text>
</svg>